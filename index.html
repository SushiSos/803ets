<meta charset="UTF-8<meta name="viewport" content="width=device-width, initial-scale=1.多功能
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft Yahei", system-ui, sans-serif;
}

body {
  background-color: #f5f7fa;
  padding: 40px 20px;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  color: #2c3e50;
  margin-bottom: 40px;
  font-size: 24px;
}

/* ========== 万能卡片系统【无需修改】 ========== */
.card-box {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: #ffffff;
  padding: 26px;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  cursor: pointer;
  transition: all 0.25s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}

.card-title {
  font-size: 18px;
  font-weight: bold;
  color: #2980b9;
  margin-bottom: 8px;
}

.card-desc {
  font-size: 14px;
  color: #666;
  line-height: 1.6;
}
/* ========================================== */


/* 图片查看下载弹窗系统【保留原有全部功能】 */
.img-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.img-modal img {
  max-width: 90%;
  max-height: 85vh;
  border-radius: 6px;
}
.download-btn {
  position: absolute;
  right: 30px;
  bottom: 30px;
  padding: 10px 20px;
  background: #2980b9;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}
.close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  color: #fff;
  font-size: 32px;
  cursor: pointer;
}
</style>
<body>

<div class="container">
<h1>资料</h1>

<!-- 卡片容器：所有卡片都放这里，自动排列 -->
  <div class="card-box"><!-- 已有卡片：听说答案汇总 -->
<div class="card" onclick="openLink('web/answer13.html')">
     <div class="card-title">第13周听说</div><div class="card-desc">查看英语听说完整答案，包含听选、问答、信息转述</div>
    <!-- ========== 以后所有新卡片在这里复制添加 ========== --><!-- 示例模板，直接复制使用
   <div class="card" onclick="openLink('新页面.html')">
     <div class="card-title</div><div class="card-desc">自定义描述</div>
    </div>
    -->

  </div>
<!-- 图片<div class="img-modal" id="imgModal">
 <span class="close-btn" onclick="closeModal()"></span>
 <img id="modalImg" src="" alt="">
<button class="download-btn" id="downloadBtn</button><script>
// 统一跳转函数（以后所有卡片共用，整洁规范）
function openLink(url){
  window.location.href = url;
}

// 图片查看下载功能
const modal = document.getElementById('imgModal');
const modalImg = document.getElementById('modalImg');
const downloadBtn = document.getElementById('downloadBtn');
let currentSrc = '';

document.querySelectorAll('img').forEach(img => {
  img.onclick = function() {
    currentSrc = this.src;
    modalImg.src = currentSrc;
    modal.style.display = 'flex';
  }
});

function closeModal() {
  modal.style.display = 'none';
}

downloadBtn.onclick = function() {
  const a = document.createElement('a');
  a.href = currentSrc;
  a.download = '图片';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

modal.onclick = function(e) {
  if (e.target === modal) closeModal();
}
</body></html>
