<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习资料汇总</title>
  <style>
    /* ===================== 全局变量（统一在这里修改样式） ===================== */
    :root {
      /* 主色调 */
      --main-color: #3498db;
      /* 页面背景色 */
      --page-bg: #f5f7fa;
      /* 卡片背景色 */
      --card-bg: #ffffff;
      /* 标题文字颜色 */
      --title-color: #2c3e50;
      /* 卡片描述文字颜色 */
      --desc-color: #666666;
      /* 卡片圆角大小 */
      --card-radius: 12px;
      /* 卡片阴影 */
      --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
      /* 卡片hover上浮效果 */
      --hover-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }

    body {
      background-color: var(--page-bg);
      padding: 30px 15px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--title-color);
      margin-bottom: 30px;
      font-size: 22px;
    }

    /* 卡片容器，以后所有卡片都放这里，自动排版 */
    .card-group {
      display: grid;
      gap: 20px;
    }

    /* 卡片通用样式（无需重复修改） */
    .card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 24px;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--hover-shadow);
    }

    .card-title {
      font-size: 18px;
      color: var(--main-color);
      margin-bottom: 8px;
    }

    .card-desc {
      color: var(--desc-color);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ===================== 深色模式兼容（解决页面变黑问题） ===================== */
    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #121212;
        --card-bg: #1e1e1e;
        --title-color: #e8e8e8;
        --desc-color: #bbbbbb;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>练习资料汇总</h1>

    <!-- 卡片组：所有卡片都写在这里 -->
    <div class="card-group">
      <!-- 卡片模板，以后新增卡片直接复制整段修改 -->
      <div class="card" onclick="location.href='web/answer13.html'">
        <div class="card-title">第13周周末听说套题答案</div>
        <div class="card-desc">包含听选信息、回答问题、信息转述完整答案，可查看详情</div>
      </div>

      <!-- 示例：以后你新增卡片，复制下面这段修改即可
      <div class="card" onclick="location.href='你的文件名.html'">
        <div class="card-title">这里写标题</div>
        <div class="card-desc">这里写描述文字</div>
      </div>
      -->
    </div>
  </div>
  <video controls width="800">
  <source src="video/your-video.mp4" type="video/mp4">
  <source src="video/your-video.webm" type="video/webm">
  您的浏览器不支持 HTML5 视频。
</video>

</body>
</html>
