<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>803ETS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f7fa;}
.head{padding:25px;text-align:center;background:#2c7be5;color:#fff;}
#s{width:85%;padding:10px;border-radius:20px;border:0;margin-top:15px;}
.box{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding:0 15px;}
.card{background:#fff;border-radius:10px;overflow:hidden;}
.card img{width:100%;height:200px;object-fit:cover;cursor:pointer;}
.txt{padding:12px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:999;}
.modal.show{display:flex;}
.modal img{max-width:90%;max-height:90vh;}
.close{position:absolute;top:20px;right:30px;color:#fff;font-size:30px;cursor:pointer;}
/* 新增下载按钮样式 */
.downBtn{
    position: absolute;
    bottom: 30px;
    right: 30px;
    padding: 10px 20px;
    background: #2c7be5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="head">
<h2>803ETS E听说答案</h2>
<input id="s" placeholder="搜索答案">
</div>
<div class="box" id="list"></div>

<div class="modal" id="m">
<span class="close" onclick="m.close()">×</span>
<img id="bigimg">
<!-- 下载按钮 -->
<button class="downBtn" onclick="downloadImg()">下载图片</button>
</div>

<script>
// 这里只改 标题、标签、图片名！！
let data = [
    {name:"第11周周末听说套题练习",tip:"第11周",pic:"images/Image 5-16-2026 2012.png"},
    {name:"第12周周末听说套题练习",tip:"第12周",pic:"images/ets.jpg"}
];
let list=document.getElementById("list");
let m=document.getElementById("m");
let bigimg=document.getElementById("bigimg");
let nowImgUrl = "";

function show(arr){
    list.innerHTML=""
    arr.forEach(v=>{
        list.innerHTML+=`
        <div class="card">
            <img src="${v.pic}" onclick="openimg('${v.pic}')">
            <div class="txt">
                <h4>${v.name}</h4>
                <p>${v.tip}</p>
            </div>
        </div>
        `
    })
}
// 打开大图并记录图片地址
function openimg(url){
    nowImgUrl = url;
    bigimg.src=url
    m.classList.add("show")
    document.body.style.overflow="hidden"
}
// 图片下载功能
function downloadImg(){
    let a = document.createElement('a');
    a.href = nowImgUrl;
    a.download = "E听说答案图片";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
m.onclick=e=>{if(e.target===m){m.classList.remove("show");document.body.style.overflow=""}}
show(data)
document.getElementById("s").oninput=e=>{
    let k=e.target.value
    let res=data.filter(x=>x.name.includes(k)||x.tip.includes(k))
    show(res)
}
</script>
</body>
</html>
