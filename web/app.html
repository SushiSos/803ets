<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>803ets 最新 APK 下载器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    color: #e6edf3; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 560px; background: #161b22;
    border: 1px solid #30363d; border-radius: 16px; padding: 32px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
  label { display:block; font-size:13px; color:#8b949e; margin-bottom:6px; }
  input {
    width: 100%; padding: 11px 14px; border-radius: 8px;
    border: 1px solid #30363d; background: #0d1117; color:#e6edf3;
    font-size: 14px; margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #238636; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  button:hover { background: #2ea043; }
  button:disabled { background:#30363d; cursor:not-allowed; }
  .result { margin-top: 22px; }
  .status { padding:14px 16px; border-radius:8px; font-size:14px; line-height:1.6; }
  .status.loading { background:#1f2937; color:#8b949e; }
  .status.error { background:#3d1d1d; color:#f85149; border:1px solid #5c2a2a; }
  .status.empty { background:#3a2f1a; color:#d29922; border:1px solid #5c4a1f; }

  /* ===== 其他推荐 区域 ===== */
  .section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 700; color: #e6edf3;
    margin-bottom: 14px;
  }
  .section-title::before {
    content: ''; width: 4px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, #8957e5, #bc8cff);
    display: inline-block;
  }
  .section-title .line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, #30363d, transparent);
  }

  .feature-box {
    background: linear-gradient(180deg, #1b2233 0%, #12161f 100%);
    border: 1px solid #8957e5;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 0 0 1px #8957e533, 0 6px 20px rgba(137,87,229,0.15);
  }
  .feature-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; margin-bottom: 4px;
  }
  .feature-head .moon { color: #bc8cff; }
  .feature-desc { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
  .feature-box .apk { background: #0d1117; }
  .feature-box .status { margin: 0; }

  .apk { background:#0d1117; border:1px solid #30363d; border-radius:12px; padding:18px; }
  .apk .tag { display:inline-block; background:#1f6feb33; color:#58a6ff; border:1px solid #1f6feb; border-radius:20px; padding:2px 12px; font-size:13px; margin-bottom:12px; }
  
  /* ===== 文件名与说明按钮 ===== */
  .apk .name-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .apk .name { font-size:15px; font-weight:600; word-break:break-all; flex: 1; }
  .apk .info-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: #1f6feb33; color: #58a6ff; font-size: 14px; font-weight: 700;
    cursor: pointer; flex-shrink: 0; margin-top: 1px;
    border: 1px solid #1f6feb; transition: all .15s;
    user-select: none;
  }
  .apk .info-btn:hover { background: #1f6feb; color: #fff; }

  .apk .meta { color:#8b949e; font-size:13px; margin-bottom:16px; }

  /* ===== 更新日志及原链接说明面板 ===== */
  .link-info {
    display: none;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
    font-size: 13px;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  
  .info-section { margin-bottom: 12px; }
  .info-section:last-child { margin-bottom: 0; }
  .info-label { color: #8b949e; font-size: 12px; margin-bottom: 6px; font-weight: 600; }
  
  /* 更新日志样式 */
  .changelog-box {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px 12px;
    color: #c9d1d9;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap; /* 保留换行和空格 */
    word-break: break-word;
    max-height: 180px;
    overflow-y: auto;
  }
  /* 美化滚动条 */
  .changelog-box::-webkit-scrollbar { width: 6px; }
  .changelog-box::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

  .link-text {
    color: #58a6ff; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    background: #0d1117; padding: 8px; border-radius: 6px;
    border: 1px solid #30363d; margin-bottom: 8px;
    font-size: 12px;
  }
  .copy-btn {
    width: auto; padding: 5px 12px; font-size: 12px; font-weight: 500;
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    border-radius: 6px; cursor: pointer; transition: all .15s;
  }
  .copy-btn:hover { background: #30363d; }

  .dl-group { display: flex; flex-direction: column; gap: 10px; }
  .dl {
    display:block; text-align:center; background:#238636; color:#fff !important;
    text-decoration:none; padding:12px; border-radius:8px; font-weight:600;
    border:1px solid transparent; transition: background .15s;
  }
  .dl:hover { background:#2ea043; }
  .dl .badge {
    display:inline-block; font-size:11px; font-weight:600; padding:1px 8px;
    border-radius:20px; margin-right:8px; vertical-align:1px;
    background:rgba(255,255,255,.18);
  }
  .dl.alt {
    background:#21262d; color:#e6edf3 !important; border-color:#30363d; font-weight:500;
  }
  .dl.alt:hover { background:#30363d; }
  .dl.alt .badge { background:#30363d; color:#8b949e; }

  .hint { margin-top:10px; font-size:12px; color:#6e7681; text-align:center; }
  .divider { height:1px; background:#30363d; margin: 28px 0; }
  .foot { margin-top:20px; font-size:12px; color:#6e7681; text-align:center; }
  a.lnk { color:#58a6ff; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>APK 最新版本下载器</h1>
    <p class="sub">通过 GitHub API 自动获取指定仓库最新 release 中的 APK</p>

    <!-- 原有主查询区 -->
    <label for="repo">GitHub 仓库地址</label>
    <input id="repo" type="text" value="https://github.com/SushiSos/803ets">
    <button id="btn" onclick="fetchLatest()">获取最新版本</button>
    <div class="result" id="result"></div>

    <div class="divider"></div>

    <!-- 其他推荐：仅包含 Stellar -->
    <div class="section-title">其他推荐<span class="line"></span></div>

    <div class="feature-box">
      <div class="feature-head"><span class="moon">☾</span> Stellar（Shizuku 魔改）最新版</div>
      <div class="feature-desc">来自 GitHub 仓库 roro2239/Stellar</div>
      <div id="stellarResult"></div>
    </div>

    <p class="foot">数据直接来自 GitHub REST API · 支持任意公开仓库</p>
  </div>

<script>
const result = document.getElementById('result');
const btn = document.getElementById('btn');
const stellarResult = document.getElementById('stellarResult');

// 主线路加速前缀（拼在原链接前面）
const PROXY_PREFIX = 'https://gh-proxy.org/';

// 固定的 Stellar 仓库信息
const STELLAR_OWNER = 'roro2239';
const STELLAR_REPO  = 'Stellar';

function parseRepo(input) {
  input = input.trim();
  let m = input.match(/github\.com\/([^\/]+)\/([^\/#?]+)/);
  if (m) return { owner: m[1], repo: m[2].replace(/\.git$/, '') };
  let parts = input.split('/');
  if (parts.length === 2) return { owner: parts[0], repo: parts[1] };
  return null;
}

function fmtSize(b) {
  if (b == null) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                  .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 通用：获取某仓库最新 release 中的 APK 资源
async function getLatestApk(owner, repo) {
  const resp = await fetch(
    `https://api.github.com/repos/${owner}/${repo}/releases`,
    { headers: { 'Accept': 'application/vnd.github+json' } }
  );
  if (resp.status === 404) throw new Error('NOT_FOUND');
  if (resp.status === 403) throw new Error('RATE_LIMIT');
  if (!resp.ok) throw new Error('HTTP ' + resp.status);

  const releases = await resp.json();
  if (!Array.isArray(releases)) throw new Error('BAD_DATA');

  const sorted = releases.filter(r => !r.draft);
  for (const r of sorted) {
    const a = (r.assets || []).find(x => /\.apk$/i.test(x.name));
    if (a) return { release: r, asset: a };
  }
  return null;
}

// 渲染“主线路 + 备用线路”下载块
function renderDownloadBlock(release, asset) {
  const rawUrl = asset.browser_download_url;          // 备用：原始链接
  const proxyUrl = PROXY_PREFIX + rawUrl;             // 主线路：加速前缀 + 原链接
  const fileName = escAttr(asset.name);
  const date = release.published_at ? release.published_at.slice(0, 10) : '';
  const meta = `发布时间 ${date}${asset.size ? ' · 大小 ' + fmtSize(asset.size) : ''}`;
  
  // 获取更新日志内容 (如果为空显示默认提示)
  const notes = release.body && release.body.trim() 
    ? escHtml(release.body.trim()) 
    : '该版本未提供具体的更新日志。';

  return `
    <div class="apk">
      <span class="tag">${release.prerelease ? '预发布 ' : ''}${escHtml(release.tag_name)}</span>
      
      <div class="name-row">
        <div class="name">${escHtml(asset.name)}</div>
        <div class="info-btn" onclick="toggleInfo(this)" title="查看更新日志与原链接">ℹ</div>
      </div>
      
      <div class="meta">${meta}</div>
      
      <!-- 说明面板 (默认隐藏) -->
      <div class="link-info">
        
        <div class="info-section">
          <div class="info-label">更新日志 (Release Notes)：</div>
          <div class="changelog-box">${notes}</div>
        </div>

        <div class="info-section" style="border-top: 1px solid #30363d; padding-top: 12px;">
          <div class="info-label">原始下载链接：</div>
          <div class="link-text">${escHtml(rawUrl)}</div>
          <button class="copy-btn" onclick="copyLink(this, '${escAttr(rawUrl)}')">复制链接</button>
        </div>
        
      </div>

      <div class="dl-group">
        <a class="dl" href="${escAttr(proxyUrl)}" download="${fileName}">
          <span class="badge">主线路</span>加速下载
        </a>
        <a class="dl alt" href="${escAttr(rawUrl)}" download="${fileName}">
          <span class="badge">备用</span>原始链接下载
        </a>
      </div>
      <div class="hint">主线路走 gh-proxy 加速；若无法下载，请改用备用线路原始链接。</div>
    </div>`;
}

// 切换说明面板的显示/隐藏
function toggleInfo(el) {
  const apkBox = el.closest('.apk');
  const infoPanel = apkBox.querySelector('.link-info');
  if (infoPanel.style.display === 'block') {
    infoPanel.style.display = 'none';
  } else {
    infoPanel.style.display = 'block';
  }
}

// 复制原链接
function copyLink(btn, url) {
  navigator.clipboard.writeText(url).then(() => {
    const originalText = btn.textContent;
    btn.textContent = '✅ 已复制';
    btn.style.color = '#3fb950';
    btn.style.borderColor = '#3fb950';
    setTimeout(() => {
      btn.textContent = originalText;
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 2000);
  }).catch(err => {
    alert('复制失败，请长按上方链接手动复制。');
  });
}

// 主查询区请求
async function fetchLatest() {
  result.innerHTML = '<div class="status loading">正在从 GitHub 获取 release 信息…</div>';
  btn.disabled = true;
  const info = parseRepo(document.getElementById('repo').value);
  if (!info) {
    result.innerHTML = '<div class="status error">仓库地址格式无法识别，请使用形如 github.com/owner/repo 的地址。</div>';
    btn.disabled = false; return;
  }
  try {
    const res = await getLatestApk(info.owner, info.repo);
    if (!res) {
      result.innerHTML = `<div class="status empty">该仓库没有可下载的 <code>.apk</code>（可能尚未发布 release，或 release 中没有 APK）。<br>
        <a class="lnk" target="_blank" href="https://github.com/${info.owner}/${info.repo}/releases">前往仓库查看</a></div>`;
      btn.disabled = false; return;
    }
    result.innerHTML = renderDownloadBlock(res.release, res.asset);
  } catch (e) {
    if (e.message === 'NOT_FOUND') {
      result.innerHTML = `<div class="status error">未找到仓库 ${info.owner}/${info.repo}，请检查地址是否正确。</div>`;
    } else if (e.message === 'RATE_LIMIT') {
      result.innerHTML = '<div class="status error">触发了 GitHub API 访问频率限制（匿名每小时 60 次）。请稍后再试。</div>';
    } else {
      result.innerHTML = `<div class="status error">请求失败：${e.message}</div>`;
    }
  }
  btn.disabled = false;
}

// 加载下方固定推荐区块
async function loadFixed(owner, repo, container) {
  container.innerHTML = '<div class="status loading">正在获取最新版本…</div>';
  try {
    const res = await getLatestApk(owner, repo);
    if (!res) {
      container.innerHTML = `<div class="status empty">已有 release，但未找到 <code>.apk</code> 文件。<br>
        <a class="lnk" target="_blank" href="https://github.com/${owner}/${repo}/releases">前往 Releases 手动下载</a></div>`;
      return;
    }
    container.innerHTML = renderDownloadBlock(res.release, res.asset);
  } catch (e) {
    let msg = '获取失败：' + e.message;
    if (e.message === 'NOT_FOUND') msg = '未找到仓库 ' + owner + '/' + repo;
    if (e.message === 'RATE_LIMIT') msg = '触发 GitHub API 频率限制（匿名每小时 60 次），请稍后再试';
    container.innerHTML = `<div class="status error">${msg}<br>
      <a class="lnk" target="_blank" href="https://github.com/${owner}/${repo}/releases">前往 Releases 手动下载</a></div>`;
  }
}

// 页面加载时：自动获取默认仓库及下方 Stellar
fetchLatest();
loadFixed(STELLAR_OWNER, STELLAR_REPO, stellarResult);
</script>
</body>
</html>
