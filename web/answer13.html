<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片查看与答案汇总</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, sans-serif;
}
body{
  background:#f5f7fa;
  padding:30px 15px;
}
.container{
  max-width:800px;
  margin:0 auto;
}
h1{
  text-align:center;
  color:#2c3e50;
  margin-bottom:30px;
  font-size:22px;
}

/* 卡片样式 */
.card{
  background:#fff;
  border-radius:12px;
  padding:24px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.25s;
  margin-bottom:30px;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 4px 18px rgba(0,0,0,0.12);
}
.card-title{
  font-size:18px;
  color:#3498db;
  margin-bottom:8px;
}
.card-desc{
  color:#666;
  font-size:14px;
  line-height:1.6;
}

/* 图片弹窗样式 */
.img-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.img-modal img {
  max-width: 90%;
  max-height: 85vh;
  border-radius: 6px;
}
.download-btn {
  position: absolute;
  right: 30px;
  bottom: 30px;
  padding: 10px 18px;
  background: #3498db;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}
.close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  color: #fff;
  font-size: 30px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
  <h1>图片查看页面</h1>

  <!-- 跳转卡片 -->
  <div class="card" onclick="location.href='answer.html'">
    <div class="card-title">第13周周末听说套题答案</div>
    <div class="card-desc">点击进入查看完整英语听说答案汇总</div>
  </div>

  <!-- 原有图片区域，你可以在这里放图片 -->
  <div>
    <p style="color:#999;text-align:center;">在此处放置你的图片内容</p>
  </div>
</div>

<!-- 图片弹窗 -->
<div class="img-modal" id="imgModal">
  <span class="close-btn" onclick="closeModal()">×</span>
  <img id="modalImg" src="" alt="">
  <button class="download-btn" id="downloadBtn">下载图片</button>
</div>

<script>
const modal = document.getElementById('imgModal');
const modalImg = document.getElementById('modalImg');
const downloadBtn = document.getElementById('downloadBtn');
let currentSrc = '';

document.querySelectorAll('img').forEach(img => {
  img.onclick = function() {
    currentSrc = this.src;
    modalImg.src = currentSrc;
    modal.style.display = 'flex';
  }
});

function closeModal() {
  modal.style.display = 'none';
}

downloadBtn.onclick = function() {
  const a = document.createElement('a');
  a.href = currentSrc;
  a.download = '图片';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

modal.onclick = function(e) {
  if (e.target === modal) closeModal();
}
</script>
</body>
</html>
